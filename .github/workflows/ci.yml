name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Configure git identity
        # Rush gitPolicy (rush.json allowedEmailRegExps) requires a @users.noreply.github.com email,
        # otherwise `rush install` aborts on the runner.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install
        run: node common/scripts/install-run-rush.js install

      - name: Rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose
        # No separate test step — command-line.json defines no custom "test" command.
        # The rebuild serves as the CI gate.
