# Publish pipeline: release-please (independent per-package versioning) ->
# pnpm pack -> npm publish (OIDC trusted publishing), straight to `latest`.
#
# All 11 publishable packages' npm Trusted Publisher points at THIS file by
# name -- npm allows exactly one trusted publisher per package, so renaming this
# workflow means redoing 11 packages by hand, each behind a security-key tap.
# Never rename it.
#
# One gate sits between a push to main and a live npm release: the `publish` job
# runs only while the `PUBLISHING_ENABLED` repository variable is the string
# "true". That is the kill switch; there is no second gate.
#
# Publishing is UNATTENDED and direct. It does not stage. `npm stage publish`
# defers proof-of-presence to a human running `npm stage approve <id>`, which
# requires 2FA that OIDC trust tokens cannot satisfy (npm/cli#9201) -- so a
# staged pipeline can never finish on its own, which is why this one does not
# use it. The cost is that a mid-sequence failure can leave a partial release:
# packages earlier in the topological order are already live. Re-running the
# workflow is the fix, since publishing is idempotent -- anything already live
# reports a duplicate and is skipped.
#
# `publish` deliberately does NOT depend on the `release-please` job. Release
# proposals and publishing are independent: publishing is keyed on each
# manifest's version against npm, so whatever lands on main with a version that
# is not yet live ships, whether release-please bumped it or a human did.
#
# The `release-please` job itself is NOT gated behind `PUBLISHING_ENABLED` --
# opening/updating a release PR touches no registry.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens/updates one release PR per package (independent versions --
  # `separate-pull-requests: true` in release-please-config.json, unlike a
  # lockstep monorepo's single combined PR). When a release PR is merged, this
  # step instead tags the release and reports it via `releases_created`.
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
    steps:
      # release-please's own PRs need a PAT, not GITHUB_TOKEN: PRs opened with
      # the default token don't trigger downstream workflow runs (GitHub
      # suppresses that to prevent recursive workflow triggering), which would
      # leave every release PR stuck waiting on a `verify` run that never
      # starts. Until the secret is set, no-op cleanly instead of failing CI.
      - name: Detect release automation token
        id: token_check
        env:
          AUTOMERGE_PAT: ${{ secrets.AUTOMERGE_PAT }}
        run: |
          if [ -n "$AUTOMERGE_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUTOMERGE_PAT not set -- skipping release-please. Set the secret to enable release PRs."
          fi

      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.token_check.outputs.present == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.AUTOMERGE_PAT }}

  # Fires on EVERY push to main, not only on a release-please merge -- publishing
  # is keyed on each manifest's version against npm, so a package that did not
  # move is a no-op and one that did ships immediately. Deliberately does NOT
  # `needs: release-please`: that job fails on its own (a duplicate release tag
  # aborts it after tagging) and gating on it would strand publishes behind an
  # unrelated failure, which is exactly what left 1.1.0 unpublished.
  publish:
    if: vars.PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Installs bun + pnpm at the versions mise.toml pins -- unlike std/ioc,
      # this repo's mise.toml already pins pnpm (10.34.4), so no separate
      # `npm install -g pnpm` step is needed here.
      - uses: jdx/mise-action@v2

      # For the OIDC-aware `.npmrc` `registry-url` writes -- this is the actual
      # mechanism trusted publishing authenticates through, not just a node
      # runtime. mise.toml also pins node 24; this is about the npm CLI + auth
      # wiring, not the runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Walks every publishable package in topological order and ships the ones
      # whose manifest version is not already on npm; the rest report a duplicate
      # and are skipped. Idempotent, so re-running a push is safe.
      - name: Publish packages whose version is not yet live
        run: bun scripts/publish-libraries.ts --publish
